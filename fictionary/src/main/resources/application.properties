spring.application.name=fictionary

# --- Base de datos (valores por defecto para desarrollo local con docker-compose.yml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fictionary}
spring.datasource.username=${DB_USER:fictionary}
spring.datasource.password=${DB_PASSWORD:fictionary}

# El esquema lo crea Flyway; Hibernate solo lo valida (nunca lo modifica)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- TMDB (la clave se pasa por variable de entorno, nunca en el repositorio) ---
fictionary.tmdb.api-key=${TMDB_API_KEY:}
fictionary.tmdb.base-url=https://api.themoviedb.org/3

# --- Ranking de Critic Points (ver docs y capítulo de diseño del ranking) ---
# weight-function: NONE (W0), LOG_INVERSE (W1), POWER (W2), PERCENTILE (W3)
fictionary.ranking.neutral-score=5.5
fictionary.ranking.prior-weight=5
fictionary.ranking.weight-function=LOG_INVERSE
fictionary.ranking.power-alpha=0.5
fictionary.ranking.percentile-min-weight=0.1
fictionary.ranking.percentile-beta=2

# --- JWT ---
fictionary.jwt.secret=${JWT_SECRET:fictionary-tfg-secret-key-2026-udc-fic-alejandro}
fictionary.jwt.expiration-ms=86400000